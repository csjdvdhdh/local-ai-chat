    .auth-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:36px 18px}.auth-card{width:min(100%,450px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}.auth-title{font-size:24px;margin:0 0 8px;letter-spacing:-.5px}.auth-lede{color:var(--muted);line-height:1.8;margin:0 0 23px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#f1f5f3;border-radius:10px;margin-bottom:22px}.auth-tab{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:9px;font-weight:700}.auth-tab.active{background:#fff;color:var(--green);box-shadow:0 1px 4px #173d3614}.field{margin-bottom:15px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #dce5e1;border-radius:9px;background:#fff;padding:11px 12px;outline:none;color:var(--ink);transition:border .15s,box-shadow .15s}.field input:focus,.field textarea:focus{border-color:#75ae95;box-shadow:0 0 0 3px #e8f5ee}.field input::placeholder,.field textarea::placeholder{color:#9aa8a5}.field .hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6}.auth-submit{width:100%;margin-top:7px}.auth-error{margin:0 0 14px;padding:10px 12px;border-radius:9px;background:var(--red-pale);color:#883e3b;line-height:1.55;font-size:13px}.setup-panel{width:min(100%,600px);background:#fff;border:1px solid #ecdba9;border-radius:17px;padding:28px;box-shadow:var(--shadow)}.setup-panel h1{font-size:22px;margin:0 0 10px}.setup-panel p{color:var(--muted);line-height:1.8;margin:0}
    .modal-backdrop{position:fixed;inset:0;z-index:20;background:rgba(18,39,43,.46);display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(100%,570px);max-height:min(92vh,820px);overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 24px 80px #102c3338}.modal.wide{width:min(100%,800px)}.modal-head{position:sticky;top:0;z-index:1;background:#fff;border-bottom:1px solid var(--line);padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.modal-head h2{font-size:19px;margin:0}.modal-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.modal-body{padding:21px 22px}.modal-foot{border-top:1px solid var(--line);padding:14px 22px;display:flex;justify-content:flex-start;gap:9px;background:#fff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.field.full{grid-column:1/-1}.file-input{padding:9px!important}.file-input::file-selector-button{border:0;border-radius:6px;padding:7px 10px;margin-inline-end:10px;background:var(--green-pale);color:var(--green);font-weight:700;cursor:pointer}.required{color:var(--red)}.token-note{font-size:11px;color:var(--muted);line-height:1.7;background:#f5f8f6;border-radius:8px;padding:10px 12px;margin:-3px 0 15px}.detail-header{display:flex;align-items:center;gap:13px}.detail-title h2{margin:0 0 6px}.detail-title .muted{font-size:12px}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.detail-block{border:1px solid var(--line);border-radius:11px;margin-top:14px;overflow:hidden}.detail-block h3{font-size:13px;margin:0;padding:12px 14px;background:#f8faf9;border-bottom:1px solid var(--line)}.detail-data{padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.detail-data div{min-width:0}.data-label{font-size:11px;color:var(--muted);margin-bottom:5px}.data-value{font-size:13px;overflow-wrap:anywhere}.logs{margin:0;padding:14px;white-space:pre-wrap;overflow:auto;max-height:300px;background:#142a32;color:#dcebe5;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.7;direction:ltr;text-align:left;min-height:70px}.toast-region{position:fixed;left:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:8px}.toast{background:#19363b;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:min(390px,calc(100vw - 40px));font-size:13px;line-height:1.5;animation:rise .18s ease-out}.toast.error{background:#973e3e}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.footer{border-top:1px solid var(--line);padding:18px 24px;text-align:center;color:#82908c;font-size:11px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:850px){.bot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:0 20px}.page{padding:27px 20px 45px}}
    @media(max-width:580px){.topbar{height:63px;padding:0 15px}.brand-mark{width:36px;height:36px}.brand-name{font-size:16px}.brand-sub{font-size:10px}.top-actions{gap:6px}.user-chip .user-email{display:none}.page{padding:24px 15px 36px}.page-heading{align-items:stretch;flex-direction:column;gap:16px}.page-heading h1{font-size:24px}.page-heading>.btn{width:100%}.summary{flex-wrap:wrap}.bot-grid{grid-template-columns:1fr;gap:11px}.bot-card{padding:15px}.empty{padding:45px 18px}.auth-wrap{min-height:calc(100vh - 63px);padding:20px 14px}.auth-card{padding:23px 19px}.modal-backdrop{padding:0;align-items:flex-end}.modal,.modal.wide{width:100%;max-height:92dvh;border-radius:17px 17px 0 0}.modal-head{padding:16px 17px}.modal-body{padding:17px}.modal-foot{padding:12px 17px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.detail-data{grid-template-columns:1fr 1fr}.detail-actions .btn{flex:1}.toast-region{left:12px;bottom:12px}.setup-panel{padding:22px}}

<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="مدار — الصفحة الرئيسية" onclick="return false">
      <span class="brand-mark" aria-hidden="true">م</span>
      <span><span class="brand-name">مدار</span><span class="brand-sub">استضافة بوتات Telegram</span></span>
    </a>
    <div class="top-actions" id="topActions"></div>
  </header>
  <main id="app" aria-live="polite"></main>
  <div class="modal-backdrop" id="modalRoot" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  <div class="toast-region" id="toastRegion" aria-live="assertive"></div>
  <footer class="footer">مدار · إدارة بوتاتك من مكان واحد</footer>
  <script>
  (()=>{
    'use strict';
    const API='/api';
    const state={csrf:null,user:null,bots:[],config:null,authMode:'login',loading:false,currentBot:null,logsTimer:null,setupMessage:''};
    const app=document.getElementById('app');
    const topActions=document.getElementById('topActions');
    const modalRoot=document.getElementById('modalRoot');
    const $=(sel,root=document)=>root.querySelector(sel);
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const jsArg=value=>"'"+String(value??'').replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r/g,"\\r").replace(/\n/g,"\\n").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029").replace(/</g,"\\x3c")+"'";
    const fmtDate=value=>{if(!value)return '—';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):new Intl.DateTimeFormat('ar',{dateStyle:'medium',timeStyle:'short'}).format(d)};
    function toast(message,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=message;$('#toastRegion').append(el);setTimeout(()=>el.remove(),4500)}
    function messageFrom(data,fallback){return data?.message||data?.detail||data?.error||fallback||'حدث خطأ غير متوقع'}
    async function request(path,{method='GET',body,headers={},authRequest=false,form=false}={}){
      const mutating=!['GET','HEAD','OPTIONS'].includes(method.toUpperCase());
      const h={...headers};if(body&&!form&&!h['Content-Type'])h['Content-Type']='application/json';
      if(mutating&&state.csrf)h['X-CSRF-Token']=state.csrf;
      let response;
      try{response=await fetch(API+path,{method,headers:h,body:body??undefined,credentials:'same-origin'});}catch(e){throw new Error('تعذّر الاتصال بالخدمة. تحقق من الاتصال ثم أعد المحاولة.')}
      let data=null;const text=await response.text();if(text){try{data=JSON.parse(text)}catch{data={message:text}}}
      if(response.status===401&&!authRequest){state.csrf=null;state.user=null;state.bots=[];closeModal();render();throw new Error('انتهت الجلسة. سجّل الدخول مجدداً.')}
      if(response.status===503){const msg=messageFrom(data,'خدمة Railway غير مُعدّة بعد. راجع إعدادات الخدمة ثم أعد المحاولة.');state.setupMessage=msg;render();throw new Error(msg)}
      if(!response.ok)throw new Error(messageFrom(data,`تعذّر تنفيذ الطلب (${response.status})`));
      return data;
    }
    function showSetup(message){state.setupMessage=message||'خدمة Railway غير مُعدّة بعد. أكمل إعداد متغيرات البيئة والخدمة ثم أعد المحاولة.';render()}
    async function initialize(){renderLoading();try{state.config=await request('/config');if(state.config?.configured===false){showSetup(state.config.message);return}try{const me=await request('/me');state.user=me?.user??me;state.csrf=me?.csrf_token??null;await loadBots()}catch(e){if(state.setupMessage)return;if(!state.user)render()}}catch(e){if(state.setupMessage)return;renderConfigError(e.message)}}
    function renderLoading(){app.innerHTML='<section class="page"><div class="page-heading"><div><div class="eyebrow">مساحة العمل</div><h1>بوتاتك</h1><p>جارٍ التحقق من جلسة العمل...</p></div></div><div class="bot-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></section>'}
    function renderConfigError(msg){app.innerHTML=`<div class="auth-wrap"><section class="setup-panel"><h1>تعذّر الاتصال بالخدمة</h1><p>${esc(msg)}</p><button class="btn btn-primary" style="margin-top:18px" onclick="window.__app.retry()">إعادة المحاولة</button></section></div>`}
    function render(){clearInterval(state.logsTimer);state.logsTimer=null;if(state.setupMessage){renderSetup();return}if(!state.user){renderAuth();return}renderDashboard()}
    function renderSetup(){topActions.innerHTML='';app.innerHTML=`<div class="auth-wrap"><section class="setup-panel"><div class="eyebrow">إعداد الخدمة</div><h1>المنصة غير جاهزة بعد</h1><p>${esc(state.setupMessage)}</p><button class="btn btn-secondary" style="margin-top:20px" onclick="window.__app.clearSetup()">إعادة المحاولة</button></section></div>`}
    function renderAuth(){topActions.innerHTML='';const signup=state.authMode==='signup';app.innerHTML=`<div class="auth-wrap"><section class="auth-card"><div class="eyebrow">منصة استضافة البوتات</div><h1 class="auth-title">${signup?'أنشئ حسابك':'مرحباً بعودتك'}</h1><p class="auth-lede">${signup?'أنشئ مساحة آمنة لإدارة بوتات Telegram الخاصة بك.':'سجّل الدخول لمتابعة تشغيل وإدارة بوتاتك.'}</p><div class="auth-tabs"><button class="auth-tab ${!signup?'active':''}" type="button" onclick="window.__app.setAuthMode('login')">تسجيل الدخول</button><button class="auth-tab ${signup?'active':''}" type="button" onclick="window.__app.setAuthMode('signup')">إنشاء حساب</button></div><div id="authError" class="auth-error hidden" role="alert"></div><form id="authForm" novalidate><div class="field"><label for="authEmail">البريد الإلكتروني</label><input id="authEmail" name="email" type="email" autocomplete="email" required placeholder="name@example.com"></div><div class="field"><label for="authPassword">كلمة المرور</label><input id="authPassword" name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" required minlength="12" placeholder="${signup?'12 حرفاً على الأقل':'أدخل كلمة المرور'}"></div>${signup?'<div class="field"><label for="inviteCode">رمز الدعوة <span class="muted">(إن طُلب)</span></label><input id="inviteCode" name="invite_code" autocomplete="off" placeholder="أدخل رمز الدعوة إن توفر"></div>':''}<button class="btn btn-primary auth-submit" id="authSubmit" type="submit">${signup?'إنشاء الحساب':'تسجيل الدخول'}</button></form></section></div>`;
      $('#authForm').addEventListener('submit',submitAuth);
    }
    async function submitAuth(event){event.preventDefault();const form=event.currentTarget;const button=$('#authSubmit');const error=$('#authError');error.classList.add('hidden');if(!form.reportValidity())return;button.disabled=true;button.textContent='جارٍ التحقق...';const signup=state.authMode==='signup';const payload={email:$('#authEmail').value.trim(),password:$('#authPassword').value};if(signup)payload.invite_code=$('#inviteCode').value.trim();try{const data=await request(signup?'/auth/signup':'/auth/login',{method:'POST',body:JSON.stringify(payload),authRequest:true});state.csrf=data?.csrf_token??data?.csrfToken??null;state.user=data?.user??data?.account??null;if(!state.user){try{const me=await request('/me');state.user=me?.user??me;state.csrf=state.csrf??me?.csrf_token??null}catch(e){if(state.setupMessage)throw e;throw new Error('تم تسجيل الدخول لكن تعذّر تحميل الحساب. أعد المحاولة.')}}await loadBots();}catch(e){if(state.setupMessage)return;error.textContent=e.message;error.classList.remove('hidden')}finally{if($('#authSubmit')){button.disabled=false;button.textContent=signup?'إنشاء الحساب':'تسجيل الدخول'}}}
    function statusOf(bot){const raw=String(bot?.status??bot?.state??'stopped').toLowerCase();if(['running','online','active','started','healthy'].includes(raw))return ['running','يعمل'];if(['error','failed','crashed','failure'].includes(raw))return ['error','خطأ'];if(['starting','stopping','deploying','pending','queued'].includes(raw))return ['pending','قيد المعالجة'];return ['stopped','متوقف']}
    function botId(bot){return bot?.id??bot?.bot_id??''}
    function renderDashboard(){const email=state.user?.email??state.user?.username??'حسابي';topActions.innerHTML=`<div class="user-chip"><span class="avatar">${esc(String(email).trim().slice(0,1).toUpperCase()||'م')}</span><span class="user-email">${esc(email)}</span></div><button class="btn btn-quiet btn-small" onclick="window.__app.logout()">تسجيل الخروج</button>`;
      const running=state.bots.filter(b=>statusOf(b)[0]==='running').length;const limit=state.config?.limits;const botCount=state.bots.length;let limitText='';if(limit&&typeof limit==='object'){const max=limit.bots??limit.max_bots??limit.maxBots;if(max!=null)limitText=`<div class="summary-pill">الحد الأقصى <strong>${esc(max)}</strong></div>`}else if(limit!=null&&typeof limit!=='object')limitText=`<div class="summary-pill">الحد الأقصى <strong>${esc(limit)}</strong></div>`;
      const cards=state.bots.map(bot=>{const [cls,label]=statusOf(bot);const id=botId(bot);const name=bot.name||bot.username||'بوت بدون اسم';const updated=bot.updated_at||bot.created_at||bot.last_deployed_at;return `<article class="bot-card" role="button" tabindex="0" aria-label="تفاصيل ${esc(name)}" onclick="window.__app.openBot(${jsArg(id)})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.__app.openBot(${jsArg(id)})}"><div class="card-top"><span class="bot-symbol" aria-hidden="true">${esc(String(name).slice(0,1).toUpperCase())}</span><span class="status status-${cls}">${label}</span></div><h2 class="bot-name">${esc(name)}</h2><div class="bot-meta"><span>Python</span>${bot.telegram_username?`<span>·</span><span dir="ltr">@${esc(bot.telegram_username)}</span>`:''}</div><div class="card-bottom"><span>${updated?'آخر تحديث':'أُضيف'} · ${esc(fmtDate(updated||bot.created_at))}</span><span aria-hidden="true">←</span></div></article>`}).join('');
      app.innerHTML=`<section class="page"><div class="page-heading"><div><div class="eyebrow">مساحة العمل</div><h1>بوتاتك</h1><p>أدر عمليات تشغيل بوتات Telegram المكتوبة ببايثون من لوحة واحدة.</p></div><button class="btn btn-primary" onclick="window.__app.openAdd()"><span aria-hidden="true">＋</span> إضافة بوت</button></div>${state.config?.message?`<div class="notice info"><span>ⓘ</span><div>${esc(state.config.message)}</div></div>`:''}<div class="summary"><div class="summary-pill"><span class="dot"></span> إجمالي البوتات <strong>${botCount}</strong></div><div class="summary-pill"><span class="dot live"></span> قيد التشغيل <strong>${running}</strong></div>${limitText}</div>${state.loading?'<div class="bot-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>':botCount?`<div class="bot-grid">${cards}</div>`:`<section class="empty"><div class="empty-icon" aria-hidden="true">＋</div><h2>ابدأ بإضافة أول بوت</h2><p>ارفع ملف Python، أضف توكن Telegram، وسنجهّز لك مساحة لإدارة البوت ومتابعة سجلاته.</p><button class="btn btn-primary" onclick="window.__app.openAdd()">إضافة بوت جديد</button></section>`}</section>`;
    }
    async function loadBots(){state.loading=true;renderDashboard();try{const data=await request('/bots');state.bots=Array.isArray(data)?data:(data?.bots??data?.items??[]);if(!Array.isArray(state.bots))state.bots=[];}catch(e){if(state.setupMessage)return;if(state.user)toast(e.message,'error')}finally{state.loading=false;if(state.user)renderDashboard()}}
    function openModal(html,wide=false){modalRoot.innerHTML=`<section class="modal ${wide?'wide':''}">${html}</section>`;modalRoot.classList.add('open');document.body.style.overflow='hidden';modalRoot.onclick=e=>{if(e.target===modalRoot)closeModal()};document.addEventListener('keydown',escapeModal,{once:true})}
    function escapeModal(e){if(e.key==='Escape')closeModal()}
    function closeModal(){modalRoot.classList.remove('open');modalRoot.innerHTML='';document.body.style.overflow='';clearInterval(state.logsTimer);state.logsTimer=null;state.currentBot=null}
    function openAdd(){openModal(`<div class="modal-head"><div><h2 id="modalTitle">إضافة بوت جديد</h2><p>ارفع ملفات المشروع وأدخل بيانات ربط Telegram.</p></div><button class="btn-icon" aria-label="إغلاق" onclick="window.__app.closeModal()">×</button></div><form id="addBotForm"><div class="modal-body"><div id="addError" class="auth-error hidden" role="alert"></div><div class="form-grid"><div class="field full"><label for="botName">اسم البوت <span class="required">*</span></label><input id="botName" name="name" required maxlength="100" placeholder="مثال: بوت خدمة العملاء"></div><div class="field full"><label for="sourceFile">ملف البوت <span class="required">*</span></label><input class="file-input" id="sourceFile" name="source_file" type="file" accept=".py,text/x-python,text/plain" required><div class="hint" id="sourceHint">ملف Python بامتداد .py. الحد الأقصى: يجري التحقق من إعدادات الخدمة.</div></div><div class="field full"><label for="telegramToken">توكن Telegram <span class="required">*</span></label><input id="telegramToken" name="telegram_token" type="password" required autocomplete="off" placeholder="123456789:AA..."><div class="token-note">تعامل مع التوكن ككلمة مرور سرية. لا تشاركه علناً، واستخدم توكن البوت الذي أنشأته عبر BotFather.</div></div><div class="field full"><label for="requirementsFile">requirements.txt <span class="muted">(اختياري)</span></label><input class="file-input" id="requirementsFile" name="requirements_file" type="file" accept=".txt,text/plain"><div class="hint">ملف المتطلبات الذي يحتاجه مشروعك لتثبيت الحزم.</div></div></div></div><div class="modal-foot"><button class="btn btn-primary" id="addSubmit" type="submit">رفع وإضافة البوت</button><button class="btn btn-secondary" type="button" onclick="window.__app.closeModal()">إلغاء</button></div></form>`,false);$('#addBotForm').addEventListener('submit',submitBot);loadUploadLimits()}
    async function loadUploadLimits(){try{const data=await request('/config');if(data?.limits){state.config=data;const limits=data.limits;let max=limits.max_file_size??limits.max_upload_size??limits.max_source_file_size??limits.upload_max_bytes;if(typeof max==='number'&&max>0){window.__app.maxFileBytes=max;$('#sourceHint').textContent=`ملف Python بامتداد .py. الحد الأقصى: ${humanSize(max)}.`}}}catch(e){}}
    function humanSize(bytes){if(bytes<1024)return `${bytes} بايت`;if(bytes<1048576)return `${(bytes/1024).toFixed(0)} كيلوبايت`;return `${(bytes/1048576).toFixed(1)} ميغابايت`}
    function validateFile(file,kind){if(!file)return `${kind==='source'?'اختر ملف البوت.':'اختر ملف المتطلبات.'}`;if(kind==='source'&&!file.name.toLowerCase().endsWith('.py'))return 'يجب أن يكون ملف البوت بامتداد .py.';if(kind==='requirements'&&!file.name.toLowerCase().endsWith('.txt'))return 'يجب أن يكون ملف المتطلبات بامتداد .txt.';const max=window.__app.maxFileBytes;if(max&&file.size>max)return `حجم الملف يتجاوز الحد الأقصى (${humanSize(max)}).`;return ''}
    async function submitBot(event){event.preventDefault();const form=event.currentTarget;if(!form.reportValidity())return;const src=$('#sourceFile').files[0],req=$('#requirementsFile').files[0];let problem=validateFile(src,'source');if(!problem&&req)problem=validateFile(req,'requirements');const error=$('#addError');if(problem){error.textContent=problem;error.classList.remove('hidden');return}error.classList.add('hidden');const button=$('#addSubmit');button.disabled=true;button.textContent='جارٍ رفع الملفات...';const body=new FormData();body.append('name',$('#botName').value.trim());body.append('source_file',src);if(req)body.append('requirements_file',req);body.append('telegram_token',$('#telegramToken').value.trim());try{const bot=await request('/bots',{method:'POST',body,form:true});closeModal();toast('تمت إضافة البوت بنجاح');await loadBots();if(bot&&(bot.id??bot.bot_id))openBot(bot.id??bot.bot_id)}catch(e){if(state.setupMessage)return;error.textContent=e.message;error.classList.remove('hidden');if($('#addSubmit')){button.disabled=false;button.textContent='رفع وإضافة البوت'}}}
    async function openBot(id){if(!id){toast('تعذّر تحديد البوت','error');return}openModal(`<div class="modal-head"><div class="detail-header"><span class="bot-symbol">…</span><div class="detail-title"><h2 id="modalTitle">تفاصيل البوت</h2><div class="muted">جارٍ تحميل البيانات...</div></div></div><button class="btn-icon" aria-label="إغلاق" onclick="window.__app.closeModal()">×</button></div><div class="modal-body"><div class="skeleton" style="height:180px"></div></div>`,true);state.currentBot=String(id);try{const data=await request(`/bots/${encodeURIComponent(id)}`);if(!modalRoot.classList.contains('open')||state.currentBot!==String(id))return;const bot=data?.bot??data;renderBotDetail(bot);await loadLogs(id);if(statusOf(bot)[0]==='running')state.logsTimer=setInterval(()=>loadLogs(id,true),12000)}catch(e){if(state.setupMessage)return;if(modalRoot.classList.contains('open')){$('.modal-body').innerHTML=`<div class="auth-error">${esc(e.message)}</div>`}}}
    function renderBotDetail(bot){const id=botId(bot)||state.currentBot;const [cls,label]=statusOf(bot);const name=bot.name||bot.username||'بوت بدون اسم';const info=[['الحالة',`<span class="status status-${cls}">${label}</span>`],['معرّف البوت',esc(id)],['تاريخ الإضافة',esc(fmtDate(bot.created_at))],['آخر تحديث',esc(fmtDate(bot.updated_at))]];if(bot.telegram_username)info.push(['اسم Telegram',`<span dir="ltr">@${esc(bot.telegram_username)}</span>`]);if(bot.runtime)info.push(['بيئة التشغيل',esc(bot.runtime)]);$('.modal-head').innerHTML=`<div class="detail-header"><span class="bot-symbol">${esc(String(name).slice(0,1).toUpperCase())}</span><div class="detail-title"><h2 id="modalTitle">${esc(name)}</h2><div class="muted">تفاصيل وتشغيل البوت</div></div></div><button class="btn-icon" aria-label="إغلاق" onclick="window.__app.closeModal()">×</button>`;$('.modal-body').innerHTML=`<div class="detail-actions">${cls==='running'?`<button class="btn btn-secondary btn-small" onclick="window.__app.botAction(${jsArg(id)},'stop')">إيقاف البوت</button>`:`<button class="btn btn-primary btn-small" onclick="window.__app.botAction(${jsArg(id)},'start')">بدء التشغيل</button>`}<button class="btn btn-danger btn-small" onclick="window.__app.deleteBot(${jsArg(id)},${jsArg(name)})">حذف البوت</button><button class="btn btn-secondary btn-small" onclick="window.__app.refreshBot(${jsArg(id)})">تحديث</button></div><section class="detail-block"><h3>معلومات البوت</h3><div class="detail-data">${info.map(([k,v])=>`<div><div class="data-label">${k}</div><div class="data-value">${v}</div></div>`).join('')}</div></section><section class="detail-block"><h3>سجلات التشغيل <button class="btn btn-quiet btn-small" style="float:left;padding:0 5px;min-height:22px" onclick="window.__app.loadLogs(${jsArg(id)})">تحديث السجلات</button></h3><pre class="logs" id="botLogs">جارٍ تحميل السجلات...</pre></section>`}
    async function loadLogs(id,quiet=false){if(!modalRoot.classList.contains('open')||state.currentBot!==String(id))return;try{const data=await request(`/bots/${encodeURIComponent(id)}/logs`);const target=$('#botLogs');if(!target)return;let logs=data?.logs??data?.items??data?.output??data;if(Array.isArray(logs))logs=logs.map(line=>typeof line==='string'?line:JSON.stringify(line)).join('\n');else if(logs&&typeof logs==='object')logs=JSON.stringify(logs,null,2);target.textContent=(logs==null||logs==='')?'لا توجد سجلات بعد.':String(logs);target.scrollTop=target.scrollHeight}catch(e){if(state.setupMessage)return;const target=$('#botLogs');if(target&&!quiet)target.textContent=e.message}}
    async function refreshBot(id){try{const data=await request(`/bots/${encodeURIComponent(id)}`);const bot=data?.bot??data;renderBotDetail(bot);await loadLogs(id);toast('تم تحديث بيانات البوت')}catch(e){if(!state.setupMessage)toast(e.message,'error')}}
    async function botAction(id,action){const label=action==='start'?'بدء تشغيل':'إيقاف';try{await request(`/bots/${encodeURIComponent(id)}/${action}`,{method:'POST',body:JSON.stringify({})});toast(`تم إرسال طلب ${label} البوت`);await loadBots();const data=await request(`/bots/${encodeURIComponent(id)}`);const bot=data?.bot??data;renderBotDetail(bot);await loadLogs(id);if(action==='start'&&!state.logsTimer)state.logsTimer=setInterval(()=>loadLogs(id,true),12000)}catch(e){if(!state.setupMessage)toast(e.message,'error')}}
    async function deleteBot(id,name){if(!confirm(`هل تريد حذف البوت «${name}»؟ لا يمكن التراجع عن هذا الإجراء.`))return;try{await request(`/bots/${encodeURIComponent(id)}`,{method:'DELETE'});closeModal();toast('تم حذف البوت');await loadBots()}catch(e){if(!state.setupMessage)toast(e.message,'error')}}
    async function logout(){try{await request('/auth/logout',{method:'POST',body:JSON.stringify({})})}catch(e){if(state.setupMessage)return}state.csrf=null;state.user=null;state.bots=[];state.setupMessage='';state.authMode='login';render()}
    function setAuthMode(mode){state.authMode=mode;renderAuth()}
    async function retry(){state.setupMessage='';await initialize()}
    window.__app={openAdd,closeModal,openBot,loadLogs,refreshBot,botAction,deleteBot,logout,setAuthMode,retry,clearSetup:retry,maxFileBytes:0};
    initialize();
  })();
  </script>
</body>
</html>
